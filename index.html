<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ТЕСТ УКУ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Roboto+Mono:wght@500;700&display=swap');

    :root {
      --bg: #050505;           
      --bg-card: rgba(15, 15, 15, 0.95);
      --bg-input: rgba(0, 0, 0, 0.6);
      --border: #2a2a2a;
      --border-hover: #555;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.4);
      --gold: #fbbf24;
      --green: #10b981;
      --red: #ef4444;
      --shadow: 0 10px 25px rgba(0,0,0,0.6);
      --selected-bg: rgba(239, 68, 68, 0.15);
      --option-hover: rgba(255, 255, 255, 0.05);
      --gradient: linear-gradient(135deg, #ef4444, #991b1b, #ef4444);
      --font-main: 'Montserrat', sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-input: #ffffff;
      --border: #cbd5e1;
      --border-hover: #94a3b8;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #dc2626;
      --accent-glow: rgba(220, 38, 38, 0.2);
      --gold: #d97706;
      --green: #059669;
      --red: #dc2626;
      --shadow: 0 10px 25px rgba(15,23,42,0.1);
      --selected-bg: rgba(220, 38, 38, 0.1);
      --option-hover: #f1f5f9;
      --gradient: linear-gradient(135deg, #dc2626, #991b1b, #dc2626);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-grid {
      position: fixed;
      inset: -50%;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.15;
      z-index: 0;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 15s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(239, 68, 68, 0.15);
      z-index: 9999;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

    .container { 
      max-width: 900px; 
      margin: 0 auto; 
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .top-controls { display: flex; gap: 10px; align-items: center; }
    
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px var(--green);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 10px var(--red); }

    .icon-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      width: 48px; height: 48px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); }
    .icon-btn.active { background: var(--selected-bg); border-color: var(--accent); color: var(--accent); }

    .header-titles { display: flex; flex-direction: column; gap: 2px; }
    h1 {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--gradient);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
      line-height: 1.1;
    }
    @keyframes shine { to { background-position: 200% center; } }
    
    .subtitle-brand {
      font-family: var(--font-mono);
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.8;
      font-weight: 700;
      margin-top: 2px;
    }
    .subtitle { font-family: var(--font-mono); color: var(--text-muted); font-size: 13px; margin-top: 8px; letter-spacing: 1px; }

    .card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 35px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
    }
    .card h2 { font-size: 20px; color: var(--gold); margin-bottom: 25px; font-weight: 800; display: flex; align-items: center; gap: 10px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 16px 18px;
      margin-bottom: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-family: var(--font-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input[type="file"] { padding: 10px; color: var(--text-muted); }
    input[type="file"]::file-selector-button {
      background: var(--border);
      border: none;
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 15px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      transition: background 0.2s;
    }
    input[type="file"]::file-selector-button:hover { background: var(--border-hover); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient);
      background-size: 200% auto;
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-family: var(--font-main);
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px var(--accent-glow);
      animation: shine 3s linear infinite;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-glow); }
    .btn:active { transform: translateY(0) scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; animation: none; }
    .btn-center { text-align: center; margin-top: 15px; }
    .btn-sm { padding: 10px 20px; font-size: 13px; border-radius: 8px; }

    .hidden { display: none !important; }

    .step-header {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px 25px;
      margin-bottom: 25px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .step-header .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .step-header .row strong { color: var(--accent); font-weight: 700; font-size: 15px; }
    
    .timer-container { display: flex; align-items: center; gap: 10px; }
    .timer {
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
      background: var(--bg-input);
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
    }
    .timer.danger { color: var(--red); border-color: var(--red); animation: pulseDanger 1s infinite alternate; }
    @keyframes pulseDanger { from { opacity: 1; } to { opacity: 0.7; } }
    
    .btn-give-up {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 8px;
      font-family: var(--font-main);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-give-up:hover { border-color: var(--red); color: var(--red); }

    .step-bar { height: 6px; background: var(--bg-input); border-radius: 999px; overflow: hidden; position: relative; }
    .step-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(.22,.8,.35,1), background-color 0.4s;
    }

    .question-wrap { touch-action: pan-y; }
    .question {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 40px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: relative;
    }
    .question.enter { animation: questionIn 0.4s cubic-bezier(.22,.8,.35,1) both; }
    @keyframes questionIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .q-part {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--selected-bg);
      border: 1px solid var(--border);
    }
    .q-title {
      font-weight: 800;
      margin-bottom: 30px;
      font-size: 20px;
      color: var(--text);
      line-height: 1.5;
      display: flex;
      gap: 18px;
    }
    .q-title .num {
      display: flex; align-items: center; justify-content: center;
      background: var(--gradient);
      color: #fff;
      min-width: 40px; height: 40px;
      border-radius: 12px;
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      font-size: 16px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      animation: optionIn 0.3s forwards;
      position: relative;
      overflow: hidden;
    }
    @keyframes optionIn { to { opacity: 1; transform: translateY(0); } }
    
    .option .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.4);
      transform: scale(0);
      animation: rippleEffect 0.5s linear;
      pointer-events: none;
    }
    @keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

    .option:hover { background: var(--option-hover); border-color: var(--border-hover); }
    .option input[type="radio"] { display: none; }
    .option .letter {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .option.selected {
      background: var(--selected-bg);
      border-color: var(--accent);
    }
    .option.selected .letter { 
      background: var(--accent); 
      color: #fff; 
      transform: scale(1.1);
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .nav-row .btn { padding: 14px 30px; font-size: 14px; }
    .nav-row .btn-back { background: transparent; color: var(--text-muted); border: 2px solid var(--border); box-shadow: none; animation: none; }
    .nav-row .btn-back:hover { border-color: var(--accent); color: var(--accent); }

    .result-card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 50px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .avatar-circle {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: var(--gradient);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900;
      margin: 0 auto 15px;
    }
    .result-card h2 { color: var(--gold); margin-bottom: 10px; font-size: 28px; }
    .result-card .score {
      font-size: 80px;
      font-weight: 900;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0;
      font-family: var(--font-mono);
      line-height: 1;
    }
    .result-card .grade { font-size: 22px; font-weight: 800; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 3px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 30px 0;
    }
    .stat-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-box .val { font-size: 32px; font-weight: 900; font-family: var(--font-mono); margin-bottom: 5px; }
    .stat-box .lbl { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .stat-box.green .val { color: var(--green); }
    .stat-box.red .val { color: var(--red); }
    .stat-box.gold .val { color: var(--gold); }

    .review-section { margin-top: 40px; text-align: left; }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }
    .review-header h3 { color: var(--text); font-size: 20px; }
    .filter-btns { display: flex; gap: 10px; }
    .filter-btn {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 13px;
      transition: background 0.2s, color 0.2s;
    }
    .filter-btn.active { background: var(--selected-bg); border-color: var(--accent); color: var(--accent); }

    .review-list { display: flex; flex-direction: column; gap: 12px; }
    .review-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
    }
    .review-item.correct { border-left: 4px solid var(--green); }
    .review-item.wrong { border-left: 4px solid var(--red); }
    
    .review-item-header { display: flex; gap: 12px; font-weight: 700; margin-bottom: 8px; align-items: center; }
    .review-q-text { color: var(--text); font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
    
    .review-answers { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .review-ans-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
    }
    [data-theme="light"] .review-ans-row { background: #f8fafc; }
    .review-ans-row.user-wrong { border: 1px solid rgba(239,68,68,0.3); color: var(--red); }
    .review-ans-row.user-correct { border: 1px solid rgba(16,185,129,0.3); color: var(--green); }
    .review-ans-row.correct-ans { border: 1px solid rgba(16,185,129,0.3); color: var(--green); background: rgba(16,185,129,0.05); }
    .review-ans-row .lbl { font-weight: 700; color: var(--text-muted); min-width: 130px; }

    .status-msg {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 14px;
      margin-top: 20px;
      min-height: 20px;
      font-weight: 700;
    }
    .status-msg.ok { color: var(--green); }
    .status-msg.err { color: var(--red); }
    .status-msg.loading { color: var(--gold); }

    .warning { color: var(--red); font-size: 14px; margin-bottom: 15px; display: none; font-weight: 700; }

    .progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 4px;
      background: var(--accent);
      width: 0%;
      z-index: 9999;
      transition: width 0.1s;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      color: var(--text);
      padding: 12px 25px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      font-weight: 600;
      z-index: 10000;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 8px; height: 8px;
      z-index: 99999;
      pointer-events: none;
      animation: fall linear forwards;
    }
    @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

    .btn-up {
      position: fixed;
      bottom: 30px; right: 30px;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.5);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      transform: translateY(20px);
      z-index: 9998;
      border: none;
    }
    .btn-up.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      h1 { font-size: 26px; }
      .card, .question, .result-card { padding: 25px 20px; }
      .nav-row { flex-direction: column-reverse; }
      .nav-row .btn { width: 100%; }
      .result-card .score { font-size: 60px; }
      .q-title { font-size: 17px; }
      .stats-grid { grid-template-columns: 1fr; gap: 10px; }
      .btn { padding: 14px 25px; }
      .step-header .row { flex-direction: column; align-items: flex-start; gap: 10px; }
      .review-header { flex-direction: column; align-items: flex-start; }
      .review-ans-row { flex-direction: column; gap: 4px; }
      .review-ans-row .lbl { min-width: unset; }
      .timer-container { width: 100%; justify-content: space-between; }
      .btn-up { bottom: 20px; right: 20px; width: 40px; height: 40px; font-size: 20px; }
    }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="progress-bar" id="progressBar"></div>
<div class="toast" id="toast">Уведомление</div>
<button class="btn-up" id="btnUp" onclick="window.scrollTo({top:0, behavior:'smooth'})">↑</button>

<div class="container">
  <div class="top-bar">
    <div class="header-titles">
      <h1>ТЕСТ УКУ</h1>
      <span class="subtitle-brand">by Bagrov FAMILY</span>
      <p class="subtitle">УК РО · КоАП РО · Процессуальный кодекс</p>
    </div>
    <div class="top-controls">
      <div class="status-dot" id="netStatus" title="Статус сети"></div>
      <button class="icon-btn" id="shuffleBtn" title="Случайный порядок" onclick="toggleShuffle()">🔀</button>
      <button class="icon-btn" id="themeToggle" title="Сменить тему" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <!-- ЭКРАН 1: Регистрация -->
  <div id="screen-auth">
    <!-- Скелетон загрузки (скрыт по умолчанию) -->
    <div id="skeletonLoader" class="hidden">
      <div class="card" style="opacity:0.5">
        <div style="height:20px; width:200px; background:var(--border); margin-bottom:20px; border-radius:4px;"></div>

let audioCtx = null;
function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'click') {
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'success') {
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'tick') {
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }
  } catch(e) {}
}

function showToast(msg, action = null) {
  const toast = document.getElementById('toast');
  toast.innerHTML = msg;
  
  if (action) {
    const btn = document.createElement('button');
    btn.textContent = action.text;
    btn.style.cssText = 'margin-left:15px; background:var(--accent); border:none; color:#fff; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:700;';
    btn.onclick = action.fn;
    toast.appendChild(btn);
  }
  
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function saveProgress() {

  try {
    const data = {
      userData,
      answers,
      currentStep,
      timeLeft,
      isShuffled,
      qIds: QUESTIONS.map(q => ALL_QUESTIONS.indexOf(q))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e) {}
}

function checkSave() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      if (data.answers && data.answers.length === 30) {
        document.getElementById('btnResume').style.display = 'block';
      }
    }
  } catch(e) {}
}

function resumeTest() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);
    if (!saved) return;
    const data = JSON.parse(saved);
    
    userData = data.userData;
    // Восстанавливаем вопросы по ID
    QUESTIONS = data.qIds.map(id => ALL_QUESTIONS[id]);
    answers = data.answers;
    currentStep = data.currentStep;
    timeLeft = data.timeLeft;
    isShuffled = data.isShuffled;
    
    document.getElementById('screen-auth').classList.add('hidden');
    document.getElementById('screen-test').classList.remove('hidden');
    document.getElementById('userLabel').textContent = `${userData.name} ${userData.surname} · ${userData.static}`;
    document.getElementById('stepTotal').textContent = QUESTIONS.length;
    
    if (isShuffled) document.getElementById('shuffleBtn').classList.add('active');
    
    isTestActive = true;
    renderStep();
    startTimer();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e) {
    showToast('Ошибка восстановления');
  }
}

          timeLeft += 60;
          allowExtraMinute = false;
          showToast('✅ Минута возвращена! (Больше нельзя)');
        }
      });
    } else {
      showToast(`⚠️ Штраф: -1 мин. (${cheatStrikes}/3)`);
    }

    if (cheatStrikes >= 3) {
      showToast('🛑 Тест аннулирован!');
      finishTest(true, true); 
    }
  }
});

window.addEventListener('beforeunload', (e) => {
  if (isTestActive) {
    e.preventDefault();
    e.returnValue = '';
  }
});

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progressBar').style.width = progress + '%';
  
  const btnUp = document.getElementById('btnUp');
  if (scrollTop > 300) btnUp.classList.add('show');
  else btnUp.classList.remove('show');
});

function startTimer() {
  const timerDisplay = document.getElementById('timerDisplay');
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      clearInterval(tickInterval);
      timerDisplay.textContent = '00:00';
      showToast('⏰ Время вышло!');
      finishTest(true);
      return;
    }
    
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    timerDisplay.textContent = `${m}:${s}`;
    
    const fill = document.getElementById('stepFill');
    if (timeLeft <= 300) {
      timerDisplay.classList.add('danger');
      fill.style.backgroundColor = 'var(--red)';
    } else if (timeLeft <= 600) {
      fill.style.backgroundColor = 'var(--gold)';
    } else {
      fill.style.backgroundColor = 'var(--green)';
    }
    
    if (timeLeft % 10 === 0) saveProgress();
  }, 1000);

  tickInterval = setInterval(() => {
    if (timeLeft <= 300 && timeLeft > 0) {
      playSound('tick');
    }
  }, 1000);
}

function startTest() {
  const name = document.getElementById('name').value.trim();
  const surname = document.getElementById('surname').value.trim();
  const staticVal = document.getElementById('static').value.trim();
  const udoFile = document.getElementById('fileUdo').files[0];
  const planFile = document.getElementById('filePlan').files[0];

  if (!name || !surname || !staticVal || !udoFile || !planFile) {
    document.getElementById('authWarning').style.display = 'block';
    showToast('⚠️ Заполните все поля!');
    return;
  }
  
  localStorage.removeItem(SAVE_KEY); // Очищаем старое сохранение
  document.getElementById('btnResume').style.display = 'none';

  userData = { name, surname, static: staticVal, udo: udoFile, plan: planFile };
  document.getElementById('screen-auth').classList.add('hidden');
  document.getElementById('screen-test').classList.remove('hidden');
  document.getElementById('userLabel').textContent = `${userData.name} ${userData.surname} · ${userData.static}`;
  document.getElementById('stepTotal').textContent = QUESTIONS.length;
  currentStep = 0;
  isTestActive = true;
  renderStep();
  startTimer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  playSound('click');
}

function renderStep() {
  const wrap = document.getElementById('questionWrap');
  const q = QUESTIONS[currentStep];
  const selected = answers[currentStep];

  wrap.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'question enter';
  div.id = 'questionCard';

  let partHtml = '';
  if (q.part) partHtml = `<div class="q-part">${q.part}</div>`;

  const optionsHtml = q.options.map((opt, i) => {
    const isSel = selected === i;
    return `
      <label class="option ${isSel ? 'selected' : ''}" style="animation-delay:${0.05 + i * 0.05}s" onclick="createRipple(event, this)">
        <input type="radio" name="q" value="${i}" ${isSel ? 'checked' : ''} onchange="pickOption(${i})">
        <span class="letter">${LETTERS[i]}</span>
        <span>${opt}</span>
      </label>
    `;
  }).join('');

  const isLast = currentStep === QUESTIONS.length - 1;
  div.innerHTML = `
    ${partHtml}
    <div class="q-title">
      <span class="num">${currentStep + 1}</span>
      <span>${q.text.replace(/^\d+\.\s*/, '')}</span>
    </div>
    <div class="options" id="optionsBox">${optionsHtml}</div>
    <div class="nav-row">
      <button class="btn btn-back" onclick="prevStep()" ${currentStep === 0 ? 'disabled' : ''}>← Назад</button>
      <button class="btn" id="nextBtn" onclick="nextStep()" disabled>${isLast ? 'Завершить' : 'Далее →'}</button>
    </div>
  `;
  wrap.appendChild(div);

  document.getElementById('stepNum').textContent = currentStep + 1;
  const fill = ((currentStep + (selected !== null ? 1 : 0)) / QUESTIONS.length) * 100;
  document.getElementById('stepFill').style.width = fill + '%';
  document.getElementById('nextBtn').disabled = selected === null;
  
  touchStartX = 0;
  saveProgress();
}

function createRipple(event, element) {
  const ripple = document.createElement("span");
  ripple.classList.add("ripple");
  element.appendChild(ripple);
  const rect = element.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = event.clientX - rect.left - size / 2 + 'px';
  ripple.style.top = event.clientY - rect.top - size / 2 + 'px';
  setTimeout(() => ripple.remove(), 500);
}

function pickOption(oIdx) {
  answers[currentStep] = oIdx;
  document.querySelectorAll('#optionsBox .option').forEach((el, i) => {
    el.classList.toggle('selected', i === oIdx);
  });
  document.getElementById('nextBtn').disabled = false;
  const fill = ((currentStep + 1) / QUESTIONS.length) * 100;
  document.getElementById('stepFill').style.width = fill + '%';
  playSound('click');
  saveProgress();
}

function nextStep() {
  if (stepLocked || answers[currentStep] === null) return;
  if (currentStep === QUESTIONS.length - 1) { finishTest(); return; }

  stepLocked = true;
  currentStep++;
  renderStep();
  stepLocked = false;
}

function prevStep() {
  if (stepLocked || currentStep === 0) return;
  stepLocked = true;
  currentStep--;
  renderStep();
  stepLocked = false;
}

function confirmGiveUp() {
  if (confirm('Вы уверены, что хотите сдаться? Все неотвеченные вопросы будут засчитаны как ошибки.')) {
    finishTest(true);
  }
}

document.getElementById('questionWrap').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
}, {passive: true});

document.getElementById('questionWrap').addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, {passive: true});

function handleSwipe() {
  if (touchStartX === 0) return;
  const diff = touchStartX - touchEndX;
  if (diff > 50) nextStep();
  if (diff < -50) prevStep();
}

function shootConfetti() {
  const colors = ['#ef4444', '#fbbf24', '#10b981', '#3b82f6'];
  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.style.left = Math.random() * 100 + 'vw';
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
    confetti.style.animationDelay = (Math.random() * 0.3) + 's';
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 4000);
  }
}

function finishTest(forceFinish = false, isCheated = false) {
  if (!forceFinish && answers.includes(null)) {
    if (!confirm(`Вы не ответили на все вопросы. Завершить?`)) return;
  }

  isTestActive = false;
  localStorage.removeItem(SAVE_KEY); // Удаляем прогресс после завершения
  if (timerInterval) clearInterval(timerInterval);
  if (tickInterval) clearInterval(tickInterval);
  playSound('success');

  let score = 0;
  reviewData = [];
  
  // Считаем правильные по частям
  let partsStats = {
    "Часть 1. УК РО": { correct: 0, total: 0 },
    "Часть 2. Задержание": { correct: 0, total: 0 },
    "Часть 3. КоАП РО": { correct: 0, total: 0 },
    "Часть 4. Процессуальный кодекс": { correct: 0, total: 0 }
  };
  let currentPartName = "Часть 1. УК РО";

  QUESTIONS.forEach((q, idx) => {
    if (q.part) currentPartName = q.part;
    
    const userAns = answers[idx];
    const isCorrect = (!isCheated && userAns === q.correct);
    if (isCorrect) score++;
    
    // Статистика по частям
    if (partsStats[currentPartName]) {
      partsStats[currentPartName].total++;
      if (isCorrect) partsStats[currentPartName].correct++;
    }

    reviewData.push({
      num: idx + 1, text: q.text,
      userAnsIdx: userAns,
      correctIdx: q.correct,
      userAnswerText: userAns !== null ? `${LETTERS[userAns]}) ${q.options[userAns]}` : '— (нет ответа)',
      correctAnswerText: `${LETTERS[q.correct]}) ${q.options[q.correct]}`,
      isCorrect
    });
  });

  document.getElementById('screen-test').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('screen-result').classList.remove('hidden');

  document.getElementById('resultUser').textContent = `${userData.name} ${userData.surname} | ${userData.static}` + (isCheated ? ' [АННУЛИРОВАНО]' : '');
  document.getElementById('avatarCircle').textContent = userData.name.charAt(0).toUpperCase();
  
  const scoreDisplay = document.getElementById('scoreDisplay');
  let currentCount = 0;
  const countInterval = setInterval(() => {
    if (currentCount >= score) {
      scoreDisplay.textContent = `${score} / ${QUESTIONS.length}`;
      clearInterval(countInterval);
    } else {
      currentCount++;
      scoreDisplay.textContent = `${currentCount} / ${QUESTIONS.length}`;
    }
  }, 30);

  const percent = Math.round((score / QUESTIONS.length) * 100);
  const wrongCount = QUESTIONS.length - score;
  
  if (!isCheated && percent >= 75) {
    setTimeout(shootConfetti, 300);
  }
  
  const statsGrid = document.getElementById('statsGrid');
  statsGrid.innerHTML = `
    <div class="stat-box green">
      <div class="val">${score}</div>
      <div class="lbl">Правильно</div>
    </div>
    <div class="stat-box red">
      <div class="val">${wrongCount}</div>
      <div class="lbl">Ошибок</div>
    </div>
    <div class="stat-box gold">
      <div class="val">${percent}%</div>
      <div class="lbl">Успех</div>
    </div>
  `;

  const gradeDisplay = document.getElementById('gradeDisplay');
  let gradeText = '', gradeColor = 'var(--accent)';
  if (isCheated) { gradeText = 'АННУЛИРОВАНО'; gradeColor = 'var(--red)'; }
  else if (percent >= 90) { gradeText = 'Отлично'; gradeColor = 'var(--green)'; }
  else if (percent >= 75) { gradeText = 'Хорошо'; gradeColor = 'var(--accent)'; }
  else if (percent >= 60) { gradeText = 'Удовлетворительно'; gradeColor = 'var(--gold)'; }
  else { gradeText = 'Неудовлетворительно'; gradeColor = 'var(--red)'; }
  gradeDisplay.textContent = `${gradeText}`;
  gradeDisplay.style.color = gradeColor;

  renderReview('all');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  sendToDiscord(score, percent, gradeText, reviewData, isCheated, partsStats);
}

function renderReview(filterType = 'all') {
  const container = document.getElementById('reviewList');
  container.innerHTML = '';
  
  const filtered = reviewData.filter(item => {
    if (filterType === 'wrong') return !item.isCorrect;
    if (filterType === 'correct') return item.isCorrect;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Нет элементов.</div>';
    return;
  }

  filtered.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = `review-item ${item.isCorrect ? 'correct' : 'wrong'}`;
    
    let answersHtml = '';
    if (item.isCorrect) {
      answersHtml = `<div class="review-ans-row user-correct"><span class="lbl">Ваш ответ:</span> <span>${item.userAnswerText}</span></div>`;
    } else {
      answersHtml = `
        <div class="review-ans-row user-wrong"><span class="lbl">Ваш ответ:</span> <span>${item.userAnswerText}</span></div>
        <div class="review-ans-row correct-ans"><span class="lbl">Правильный ответ:</span> <span>${item.correctAnswerText}</span></div>
      `;
    }

    div.innerHTML = `
      <div class="review-item-header">
        <span class="icon">${item.isCorrect ? '✅' : '❌'}</span>
        <span class="num">Вопрос ${item.num}</span>
      </div>
      <div class="review-q-text">${item.text}</div>
      <div class="review-answers">${answersHtml}</div>
    `;
    container.appendChild(div);
  });
}

function filterReview(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderReview(type);
}

function downloadReport() {
  let score = reviewData.filter(i => i.isCorrect).length;
  let percent = Math.round((score / QUESTIONS.length) * 100);
  let gradeText = percent >= 90 ? 'Отлично' : percent >= 75 ? 'Хорошо' : percent >= 60 ? 'Удовлетворительно' : 'Неудовлетворительно';
  
  const txt = buildTxtReport(score, percent, gradeText, reviewData, false);
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `report_${userData.static}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📥 TXT скачан!');
}

function downloadCSV() {
  let score = reviewData.filter(i => i.isCorrect).length;
  let percent = Math.round((score / QUESTIONS.length) * 100);
  
  let csv = '\uFEFF';
  csv += `Отчёт ТЕСТ УКУ\n`;
  csv += `Сотрудник;${userData.name} ${userData.surname}\n`;
  csv += `Статик;${userData.static}\n`;
  csv += `Правильных;${score}\n`;
  csv += `Неправильных;${QUESTIONS.length - score}\n`;
  csv += `Процент;${percent}%\n\n`;
  csv += `Вопрос;Ваш ответ;Правильный ответ;Результат\n`;
  reviewData.forEach(item => {
    const userAnsClean = item.userAnswerText.replace(/;/g, ',');
    const correctAnsClean = item.correctAnswerText.replace(/;/g, ',');
    const qTextClean = item.text.replace(/;/g, ',');
    csv += `"${qTextClean}";"${userAnsClean}";"${correctAnsClean}";"${item.isCorrect ? 'ВЕРНО' : 'ОШИБКА'}"\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `report_${userData.static}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📊 CSV скачан!');
}

function copyResult() {
  let score = reviewData.filter(i => i.isCorrect).length;
  let percent = Math.round((score / QUESTIONS.length) * 100);
  const text = `ТЕСТ УКУ | ${userData.name} ${userData.surname} | ${userData.static}\nРезультат: ${score}/${QUESTIONS.length} (${percent}%)`;
  
  navigator.clipboard.writeText(text).then(() => {
    showToast('📋 Скопировано!');
  }).catch(() => {
    showToast('❌ Ошибка копирования');
  });
}

function buildTxtReport(score, percent, gradeText, reviewItems, isCheated) {
  const wrongCount = QUESTIONS.length - score;
  const timeSpent = TEST_TIME_MINUTES * 60 - timeLeft;
  const min = Math.floor(timeSpent / 60);
  const sec = timeSpent % 60;
  
  const line = '='.repeat(50);
  const lines = [
    line,
    '           ОТЧЁТ ТЕСТ УКУ',
    line,
    `Дата: ${new Date().toLocaleString('ru-RU')}`,
    `Сотрудник: ${userData.name} ${userData.surname}`,
    `Статик: ${userData.static}`,
    `Время: ${min} мин ${sec} сек`,
    '',
    `Вопросов: ${QUESTIONS.length}`,
    `Верных: ${score}`,
    `Ошибок: ${wrongCount}`,
    `Процент: ${percent}%`,
    `Оценка: ${gradeText} ${isCheated ? '(АННУЛИРОВАНО)' : ''}`,
    '',
    line,
    'РАЗБОР ОТВЕТОВ',
    line
  ];
  reviewItems.forEach(item => {
    lines.push(`Вопрос ${item.num}: ${item.text}`);
    lines.push(`  Ваш: ${item.userAnswerText}`);
    if (!item.isCorrect) lines.push(`  Верный: ${item.correctAnswerText}`);
    lines.push(`  Результат: ${item.isCorrect ? 'ВЕРНО' : 'ОШИБКА'}\n`);
  });
  lines.push(line);
  return lines.join('\n');
}

/* Блокировка кнопки отправки */
let isSending = false;

async function sendToDiscord(score, percent, gradeText, reviewItems, isCheated, partsStats) {
  const statusEl = document.getElementById('discordStatus');
  if (isSending) return;
  
  if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes('ВСТАВЬТЕ')) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Webhook не настроен.';
    return;
  }

  if (!navigator.onLine) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Нет интернета! Скачайте файл.';
    return;
  }

  isSending = true;
  statusEl.className = 'status-msg loading';
  statusEl.innerHTML = '<span class="spinner"></span> Отправка...';

  const wrongCount = QUESTIONS.length - score;
  const embedColor = isCheated ? 0x000000 : (percent >= 90 ? 0x10b981 : percent >= 75 ? 0xef4444 : percent >= 60 ? 0xfbbf24 : 0xef4444);
  const timeSpent = TEST_TIME_MINUTES * 60 - timeLeft;
  const min = Math.floor(timeSpent / 60);
  const sec = timeSpent % 60;
  
  let content = '';
  let allowed_mentions = { parse: [] };
  
  if (NOTIFY_USER_ID.trim()) {
    const pings = NOTIFY_USER_ID.split(',').map(id => id.trim()).filter(id => /^\d{17,20}$/.test(id)).map(id => `<@${id}>`).join(' ');
    if (pings) {
      content = `${pings} — Уважаемое Руководство УКУ проверьте отчёт.`;
      allowed_mentions = { parse: ["users"] }; 
    }
  }

  const fields = [
    { name: '✅ Правильных', value: `**${score}**`, inline: true },
    { name: '❌ Неправильных', value: `**${wrongCount}**`, inline: true },
    { name: '📊 Процент', value: `**${percent}%**`, inline: true },
    { name: '🏆 Оценка', value: gradeText, inline: false },
    { name: '⏱️ Время', value: `${min} мин ${sec} сек`, inline: true }
  ];
  
  // Анализ по частям
  let partsText = '';
  for (const [name, data] of Object.entries(partsStats)) {
    if (data.total > 0) {
      partsText += `${name}: ${data.correct}/${data.total}\n`;
    }
  }
  if (partsText) {
    fields.push({ name: '📑 По разделам', value: partsText, inline: false });
  }
  
  if (isCheated) {
    fields.push({ name: '🚨 ВНИМАНИЕ', value: '**АННУЛИРОВАНО**', inline: false });
  }

  const payload = {
    username: 'ТЕСТ УКУ',
    content: content || undefined,
    allowed_mentions: allowed_mentions,
    embeds: [{
      title: '📝 Отчёт о прохождении теста',
      description: `**${userData.name} ${userData.surname}** · Статик: \`${userData.static}\``,
      color: embedColor,
      fields: fields,
      footer: { text: 'ТЕСТ УКУ · УК РО / КоАП РО' },
      timestamp: new Date().toISOString()
    }]
  };

  const formData = new FormData();
  formData.append('payload_json', JSON.stringify(payload));
  
  if (userData.udo) formData.append('files[0]', userData.udo, 'udo_' + userData.static + '.png');
  if (userData.plan) formData.append('files[1]', userData.plan, 'plan_' + userData.static + '.png');
  
  const txtBlob = new Blob([buildTxtReport(score, percent, gradeText, reviewItems, isCheated)], { type: 'text/plain;charset=utf-8' });
  formData.append('files[2]', txtBlob, 'report_' + userData.static + '.txt');

  try {
    const res = await fetch(DISCORD_WEBHOOK_URL + '?wait=true', { method: 'POST', body: formData });
    if (res.ok) {
      statusEl.className = 'status-msg ok';
      statusEl.textContent = '✅ Отчёт успешно отправлен.';
      showToast('🎉 Отправлено!');
    } else {
      statusEl.className = 'status-msg err';
      statusEl.textContent = `⚠️ Ошибка (${res.status}). Скачайте файл.`;
    }
  } catch (err) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Нет соединения.';
  } finally {
    isSending = false;
  }
}
