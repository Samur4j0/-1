<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Устный тест | УКУ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Roboto+Mono:wght@500;700&display=swap');

    /* ============ ТЕМЫ ============ */
    :root {
      /* ЧЁРНАЯ ТЕМА */
      --bg: #050505;           
      --bg-card: rgba(10, 10, 10, 0.85);
      --bg-input: rgba(0, 0, 0, 0.6);
      --border: #2a2a2a;
      --border-hover: #444;
      --text: #f1f5f9;
      --text-muted: #a1a1aa;
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.4);
      --gold: #fbbf24;
      --green: #10b981;
      --red: #ef4444;
      --shadow: 0 10px 30px rgba(0,0,0,0.8);
      --selected-bg: rgba(239, 68, 68, 0.1);
      --option-hover: rgba(239, 68, 68, 0.05);
      --gradient: linear-gradient(135deg, #ef4444, #991b1b);
      --font-main: 'Montserrat', sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-input: #ffffff;
      --border: #cbd5e1;
      --border-hover: #94a3b8;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #dc2626;
      --accent-glow: rgba(220, 38, 38, 0.2);
      --gold: #b45309;
      --green: #059669;
      --red: #dc2626;
      --shadow: 0 10px 30px rgba(15,23,42,0.1);
      --selected-bg: rgba(220, 38, 38, 0.1);
      --option-hover: #f1f5f9;
      --gradient: linear-gradient(135deg, #dc2626, #991b1b);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      transition: background 0.4s, color 0.4s;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Красная аура по краям */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 120px rgba(239, 68, 68, 0.25);
      z-index: 9999;
    }

    /* Водяной знак на фоне */
    body::before {
      content: "УКУ • МВД • ПРОТОКОЛ";
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 8vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.02);
      white-space: nowrap;
      pointer-events: none;
      z-index: 0;
    }
    [data-theme="light"] body::before { color: rgba(0, 0, 0, 0.03); }

    .container { 
      max-width: 900px; 
      margin: 0 auto; 
      position: relative;
      z-index: 1;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ ШАПКА ============ */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .theme-toggle {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      width: 48px; height: 48px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow);
      transition: all 0.3s;
    }
    .theme-toggle:hover { 
      border-color: var(--accent); 
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--accent-glow);
    }
    .subtitle { 
      font-family: var(--font-mono);
      color: var(--text-muted); 
      font-size: 13px; 
      margin-top: 8px; 
      letter-spacing: 1px;
    }

    /* ============ СТЕКЛЯННЫЕ КАРТОЧКИ ============ */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }
    .card h2 {
      font-size: 20px;
      color: var(--gold);
      margin-bottom: 24px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ============ ИНПУТЫ ============ */
    label {
      display: block;
      margin-bottom: 8px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 22px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-family: var(--font-main);
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    input[type="file"] { padding: 10px; color: var(--text-muted); }
    input[type="file"]::file-selector-button {
      background: var(--border);
      border: none;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 12px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      transition: background 0.2s;
    }
    input[type="file"]::file-selector-button:hover { background: var(--border-hover); }

    /* ============ КНОПКИ ============ */
    .btn {
      display: inline-block;
      background: var(--gradient);
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-family: var(--font-main);
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(transparent, rgba(255,255,255,0.2), transparent);
      transform: rotate(45deg);
      transition: all 0.5s;
      opacity: 0;
    }
    .btn:hover::after { left: 100%; opacity: 1; }
    .btn:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 8px 25px var(--accent-glow);
    }
    .btn:active { transform: translateY(0) scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-center { text-align: center; margin-top: 15px; }

    .hidden { display: none !important; }

    /* ============ ПРОГРЕСС ШАГОВ ============ */
    .step-header {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .step-header .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .step-header .row strong { color: var(--accent); font-weight: 700; }
    .step-bar {
      height: 6px;
      background: var(--bg-input);
      border-radius: 999px;
      overflow: hidden;
    }
    .step-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(.22,.8,.35,1);
    }

    /* ============ ВОПРОС ============ */
    .question {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 32px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: relative;
    }
    .question.enter { animation: questionIn 0.5s cubic-bezier(.22,.8,.35,1) both; }
    .question.leave { animation: questionOut 0.25s ease-in both; }
    @keyframes questionIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes questionOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(-30px); }
    }

    .q-part {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      background: var(--selected-bg);
      border: 1px solid var(--border);
    }
    .q-title {
      font-weight: 700;
      margin-bottom: 24px;
      font-size: 18px;
      color: var(--text);
      line-height: 1.5;
      display: flex;
      gap: 16px;
    }
    .q-title .num {
      display: flex; align-items: center; justify-content: center;
      background: var(--gradient);
      color: #fff;
      min-width: 36px; height: 36px;
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 15px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      animation: optionIn 0.4s forwards;
    }
    @keyframes optionIn { to { opacity: 1; transform: translateY(0); } }
    
    .option:hover { 
      background: var(--option-hover); 
      border-color: var(--border-hover); 
      transform: translateX(4px);
    }
    .option input[type="radio"] { display: none; }
    
    .option .letter {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    /* Эффект выбора */
    .option.selected {
      background: var(--selected-bg);
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      transform: translateX(6px);
    }
    .option.selected .letter {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 10px var(--accent);
    }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .nav-row .btn { padding: 14px 30px; font-size: 14px; }
    .nav-row .btn-back {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .nav-row .btn-back:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

    /* ============ РЕЗУЛЬТАТ ============ */
    .result-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
    }
    .result-card h2 { color: var(--gold); margin-bottom: 10px; font-size: 24px; }
    .result-card .score {
      font-size: 64px;
      font-weight: 900;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 15px 0;
      font-family: var(--font-mono);
      text-shadow: 0 0 30px var(--accent-glow);
    }
    .result-card .grade { 
      font-size: 20px; 
      font-weight: 800; 
      margin-bottom: 30px; 
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .status-msg {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 14px;
      margin-top: 20px;
      min-height: 22px;
      font-weight: 700;
    }
    .status-msg.ok { color: var(--green); }
    .status-msg.err { color: var(--red); }
    .status-msg.loading { color: var(--gold); }

    .warning { color: var(--red); font-size: 13px; margin-top: -10px; margin-bottom: 12px; display: none; font-weight: 600; }

    .progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      width: 0%;
      z-index: 9999;
      transition: width 0.1s;
    }

    /* ============ МОБИЛЬНАЯ АДАПТАЦИЯ ============ */
    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      h1 { font-size: 24px; }
      .card, .question, .result-card { padding: 20px; }
      .nav-row { flex-direction: column-reverse; }
      .nav-row .btn { width: 100%; }
      .result-card .score { font-size: 48px; }
      .q-title { font-size: 16px; }
    }
  </style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="container">

  <div class="top-bar">
    <div>
      <h1>Протокол УКУ</h1>
      <p class="subtitle">УК РО · КоАП РО · Процессуальный кодекс</p>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- ЭКРАН 1: Регистрация -->
  <div id="screen-auth">
    <div class="card">
      <h2>📋 Идентификация сотрудника</h2>
      <label for="name">Имя *</label>
      <input type="text" id="name" placeholder="Введите имя" autocomplete="off">
      <label for="surname">Фамилия *</label>
      <input type="text" id="surname" placeholder="Введите фамилию" autocomplete="off">
      <label for="static">Статик *</label>
      <input type="text" id="static" placeholder="Введите статик" autocomplete="off">
      <label for="fileUdo">Удостоверение (УДО) *</label>
      <input type="file" id="fileUdo" accept="image/*">
      <label for="filePlan">Скрин планшета *</label>
      <input type="file" id="filePlan" accept="image/*">
      <div class="warning" id="authWarning">Заполните все поля и приложите скриншоты.</div>
      <div class="btn-center">
        <button class="btn" onclick="startTest()">Начать протокол</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 2: Тест -->
  <div id="screen-test" class="hidden">
    <div class="step-header">
      <div class="row">
        <span>Сотрудник: <strong id="userLabel"></strong></span>
        <span>Вопрос <strong id="stepNum">1</strong> из <strong id="stepTotal">30</strong></span>
      </div>
      <div class="step-bar"><div class="step-bar-fill" id="stepFill"></div></div>
    </div>

    <div id="questionWrap"></div>
  </div>

  <!-- ЭКРАН 3: Результат -->
  <div id="screen-result" class="hidden">
    <div class="result-card">
      <h2>Протокол завершён</h2>
      <div style="color:var(--text-muted); font-family:var(--font-mono); font-size:14px;" id="resultUser"></div>
      <div class="score" id="scoreDisplay"></div>
      <div class="grade" id="gradeDisplay"></div>
      <div class="status-msg" id="discordStatus"></div>
      <div class="btn-center" style="margin-top: 30px;">
        <button class="btn" onclick="location.reload()">Пройти заново</button>
      </div>
    </div>
  </div>

</div>

<script>
const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1568753176629350452/emztUgE0fPyxiB8H4uQ3UDrg835QjvbQSLq5aUKribYgKxH7aarGKlV4ax5DbhHvTWlG";
const NOTIFY_USER_ID = ""; /* 1354521931914805429,657932083410239488,535387398587154442,623187321700745226,381555682769502219 */

const QUESTIONS = [
  { part: "Часть 1. УК РО", text: "1. Какая статья УК РО относится к подследственности МВД (обозначение [Р])?", options: ["Ст. 6.2 (убийство) — [Ф/Р]","Ст. 12.1 (терроризм) — [Ф/С]","Ст. 10.1 (кража свыше 3 000 ₽) — [Р]","Ст. 7.1 (похищение человека) — [Ф]"], correct: 2 },
  { part: null, text: "2. Гражданин совершил кражу имущества стоимостью 4 500 ₽. По какой статье квалифицирует сотрудник МВД?", options: ["Ст. 10.1 (кража свыше 3 000 ₽)","Ст. 10.2 (кража свыше 5 000 ₽)","Ст. 10.3 (кража свыше 15 000 ₽)","Ст. 10.12 (кража с проникновением)"], correct: 0 },
  { part: null, text: "3. Сотрудник МВД задержал лицо по ст. 6.1 УК РО (телесные повреждения, ★★). Какой максимальный срок он может назначить в упрощённом порядке?", options: ["До 3 лет","До 5 лет","До 10 лет","До 20 месяцев"], correct: 1 },
  { part: null, text: "4. Что означает обозначение [Р] в статье Особенной части УК РО (ст. 5.12)?", options: ["Подследственность ФСБ","Подследственность Военной полиции","Подследственность Следственного комитета","Подследственность МВД"], correct: 3 },
  { part: null, text: "5. Сотрудник МВД задержал лицо по ст. 10.5 УК РО (грабёж). Может ли он применить упрощённый порядок?", options: ["Нет, только суд","Да, если нет спора о фактах и доказательств достаточно","Да, но только с санкции прокурора","Нет, грабёж — исключительная подследственность СК"], correct: 1 },
  { part: null, text: "6. Гражданин хранил 2,5 г каннабиноидов. Как квалифицирует сотрудник МВД?", options: ["Уголовная ответственность по ст. 12.8 УК","Уголовная ответственность по ст. 4.6 УК","Административная ответственность по ст. 7.10 КоАП с изъятием","Ответственность не наступает"], correct: 2 },
  { part: null, text: "7. Какое максимальное наказание предусмотрено за разбойное ограбление (ст. 10.6 УК РО, [Ф/Р])?", options: ["До 30 месяцев","До 40 месяцев","До 50 месяцев","До 60 месяцев"], correct: 1 },
  { part: "Часть 2. Задержание", text: "8. Сотрудник МВД задержал государственного служащего по ст. 10.5 УК РО. Может ли он назначить уголовный штраф в упрощённом порядке?", options: ["Да, если ущерб небольшой","Да, но не более 30 000 ₽","Да, с согласия задержанного","Нет, только прокурор"], correct: 3 },
  { part: null, text: "9. Какое наказание НЕ может назначить сотрудник МВД в упрощённом порядке (ст. 5.11 ч. 4 УК РО)?", options: ["Лишение свободы","Уголовный штраф","Лишение права занимать определённые должности","Конфискация"], correct: 2 },

  { part: null, text: "19. Сотрудник МВД выявил нарушение по ст. 6.1 КоАП (уклонение от наказания). Может ли он сам назначить арест?", options: ["Да, до 10 суток","Нет, только суд","Да, с санкции прокурора","Да, если нарушение повторное"], correct: 1 },

  { part: null, text: "29. Сотрудник МВД проводит обыск транспортного средства. Что из перечисленного НЕ является достаточным основанием для полного обыска без дополнительных обстоятельств (гл. V ст. 3)?", options: ["Попытка водителя скрыться от законного требования об остановке","Наличие действующей ориентировки на транспортное средство","Обнаружение оружия у водителя","Отсутствие регистрационного знака само по себе"], correct: 3 },
  { part: null, text: "30. Сотрудник МВД начал неотложный обыск жилища без предварительного судебного разрешения. В течение какого срока он обязан уведомить прокурора (гл. V ст. 2)?", options: ["Не позднее 1 часа с момента начала действия","Не позднее 3 часов","Не позднее 24 часов","Не позднее 48 часов"], correct: 0 }
];

const LETTERS = ['A', 'B', 'C', 'D'];
let userData = { name: '', surname: '', static: '', udo: null, plan: null };
let answers = new Array(QUESTIONS.length).fill(null);
let currentStep = 0;
let stepLocked = false;

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('test-theme', theme); } catch(e) {}
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem('test-theme') || 'dark'; } catch(e) {}
  applyTheme(saved);
})();

function startTest() {
  const name = document.getElementById('name').value.trim();
  const surname = document.getElementById('surname').value.trim();
  const staticVal = document.getElementById('static').value.trim();
  const udoFile = document.getElementById('fileUdo').files[0];
  const planFile = document.getElementById('filePlan').files[0];

  if (!name || !surname || !staticVal || !udoFile || !planFile) {
    document.getElementById('authWarning').style.display = 'block';
    return;
  }
  userData = { name, surname, static: staticVal, udo: udoFile, plan: planFile };
  document.getElementById('screen-auth').classList.add('hidden');
  document.getElementById('screen-test').classList.remove('hidden');
  document.getElementById('userLabel').textContent = `${userData.name} ${userData.surname} · ${userData.static}`;
  document.getElementById('stepTotal').textContent = QUESTIONS.length;
  currentStep = 0;
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderStep() {
  const wrap = document.getElementById('questionWrap');
  const q = QUESTIONS[currentStep];
  const selected = answers[currentStep];

  wrap.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'question enter';
  div.id = 'questionCard';

  let partHtml = '';
  if (q.part) partHtml = `<div class="q-part">${q.part}</div>`;

  const optionsHtml = q.options.map((opt, i) => {
    const isSel = selected === i;
    return `
      <label class="option ${isSel ? 'selected' : ''}" style="animation-delay:${0.05 + i * 0.05}s">
        <input type="radio" name="q" value="${i}" ${isSel ? 'checked' : ''} onchange="pickOption(${i})">
        <span class="letter">${LETTERS[i]}</span>
        <span>${opt}</span>
      </label>
    `;
  }).join('');

  const isLast = currentStep === QUESTIONS.length - 1;
  div.innerHTML = `
    ${partHtml}
    <div class="q-title">
      <span class="num">${currentStep + 1}</span>
      <span>${q.text.replace(/^\d+\.\s*/, '')}</span>
    </div>
    <div class="options" id="optionsBox">${optionsHtml}</div>
    <div class="nav-row">
      <button class="btn btn-back" onclick="prevStep()" ${currentStep === 0 ? 'disabled' : ''}>← Назад</button>
      <button class="btn" id="nextBtn" onclick="nextStep()" disabled>${isLast ? 'Завершить' : 'Далее →'}</button>
    </div>
  `;
  wrap.appendChild(div);

  document.getElementById('stepNum').textContent = currentStep + 1;
  const fill = ((currentStep + (selected !== null ? 1 : 0)) / QUESTIONS.length) * 100;
  document.getElementById('stepFill').style.width = fill + '%';
  document.getElementById('nextBtn').disabled = selected === null;
}

function pickOption(oIdx) {
  answers[currentStep] = oIdx;
  document.querySelectorAll('#optionsBox .option').forEach((el, i) => {
    el.classList.toggle('selected', i === oIdx);
  });
  document.getElementById('nextBtn').disabled = false;
  const fill = ((currentStep + 1) / QUESTIONS.length) * 100;
  document.getElementById('stepFill').style.width = fill + '%';
}

function nextStep() {
  if (stepLocked || answers[currentStep] === null) return;
  if (currentStep === QUESTIONS.length - 1) { finishTest(); return; }

  stepLocked = true;
  document.getElementById('questionCard').classList.add('leave');
  setTimeout(() => {
    currentStep++;
    renderStep();
    stepLocked = false;
  }, 250);
}

function prevStep() {
  if (stepLocked || currentStep === 0) return;
  stepLocked = true;
  document.getElementById('questionCard').classList.add('leave');
  setTimeout(() => {
    currentStep--;
    renderStep();
    stepLocked = false;
  }, 250);
}

function finishTest() {
  if (answers.includes(null) && !confirm(`Вы не ответили на все вопросы. Завершить?`)) return;

  let score = 0;
  const reviewItems = [];
  QUESTIONS.forEach((q, idx) => {
    const userAns = answers[idx];
    const isCorrect = userAns === q.correct;
    if (isCorrect) score++;
    reviewItems.push({
      num: idx + 1, text: q.text,
      userAnswerText: userAns !== null ? `${LETTERS[userAns]}) ${q.options[userAns]}` : '—',
      correctAnswerText: `${LETTERS[q.correct]}) ${q.options[q.correct]}`,
      isCorrect
    });
  });

  document.getElementById('screen-test').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('screen-result').classList.remove('hidden');

  document.getElementById('resultUser').textContent = `${userData.name} ${userData.surname} | ${userData.static}`;
  document.getElementById('scoreDisplay').textContent = `${score} / ${QUESTIONS.length}`;

  const percent = Math.round((score / QUESTIONS.length) * 100);
  const gradeDisplay = document.getElementById('gradeDisplay');
  let gradeText = '', gradeColor = 'var(--accent)';
  if (percent >= 90) { gradeText = 'Отлично'; gradeColor = 'var(--green)'; }
  else if (percent >= 75) { gradeText = 'Хорошо'; gradeColor = 'var(--accent)'; }
  else if (percent >= 60) { gradeText = 'Удовлетворительно'; gradeColor = 'var(--gold)'; }
  else { gradeText = 'Неудовлетворительно'; gradeColor = 'var(--red)'; }
  gradeDisplay.textContent = `${gradeText} (${percent}%)`;
  gradeDisplay.style.color = gradeColor;

  window.scrollTo({ top: 0, behavior: 'smooth' });
  sendToDiscord(score, percent, gradeText, reviewItems);
}

function buildTxtReport(score, percent, gradeText, reviewItems) {
  const wrongCount = QUESTIONS.length - score;
  const line = '='.repeat(60);
  const lines = [
    line,
    '           ОТЧЁТ О ПРОХОЖДЕНИИ ТЕСТА',
    '     УК РО / КоАП РО / Процессуальный кодекс РО',
    line,
    '',
    `Дата и время:        ${new Date().toLocaleString('ru-RU')}`,
    `Сотрудник:           ${userData.name} ${userData.surname}`,
    `Статик:              ${userData.static}`,
    '',
    `Всего вопросов:      ${QUESTIONS.length}`,
    `Правильных ответов:  ${score}`,
    `Неправильных:        ${wrongCount}`,
    `Процент:             ${percent}%`,
    `Оценка:              ${gradeText}`,
    '',
    line,
    '                  РАЗБОР ОТВЕТОВ',
    line,
    ''
  ];
  reviewItems.forEach(item => {
    lines.push(`--- Вопрос ${item.num} ---`);
    lines.push(item.text);
    lines.push(`  Ваш ответ:        ${item.userAnswerText}`);
    if (!item.isCorrect) lines.push(`  Правильный ответ: ${item.correctAnswerText}`);
    lines.push(`  Результат:        ${item.isCorrect ? 'ВЕРНО' : 'ОШИБКА'}`);
    lines.push('');
  });
  lines.push(line, 'Конец отчёта.', line);
  return lines.join('\n');
}

async function sendToDiscord(score, percent, gradeText, reviewItems) {
  const statusEl = document.getElementById('discordStatus');
  if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes('ВСТАВЬТЕ')) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Webhook не настроен.';
    return;
  }

  statusEl.className = 'status-msg loading';
  statusEl.textContent = '⏳ Отправка данных...';

  const wrongCount = QUESTIONS.length - score;
  const embedColor = percent >= 90 ? 0x10b981 : percent >= 75 ? 0xef4444 : percent >= 60 ? 0xfbbf24 : 0xef4444;
  
  let content = '';
  if (NOTIFY_USER_ID.trim()) {
    const pings = NOTIFY_USER_ID.split(',').map(id => id.trim()).filter(id => /^\d{17,20}$/.test(id)).map(id => `<@${id}>`).join(' ');
    if (pings) content = `${pings} — Уважаемое Руководство УКУ проверьте отчёт от сотрудника МВД.`;
  }

  const payload = {
    username: 'Протокол УКУ',
    content: content || undefined,
    embeds: [{
      title: '📝 Отчёт о прохождении теста',
      description: `**${userData.name} ${userData.surname}** · Статик: \`${userData.static}\``,
      color: embedColor,
      fields: [
        { name: '✅ Правильных', value: `**${score}**`, inline: true },
        { name: '❌ Неправильных', value: `**${wrongCount}**`, inline: true },
        { name: '📊 Процент', value: `**${percent}%**`, inline: true },
        { name: '🏆 Оценка', value: gradeText, inline: false }
      ],
      footer: { text: 'УКУ · УК РО / КоАП РО / Процессуальный кодекс' },
      timestamp: new Date().toISOString()
    }]
  };

  const formData = new FormData();
  formData.append('payload_json', JSON.stringify(payload));
  if (userData.udo) formData.append('files[0]', userData.udo, 'udo_' + userData.static + '.png');
  if (userData.plan) formData.append('files[1]', userData.plan, 'plan_' + userData.static + '.png');
  
  const txtBlob = new Blob([buildTxtReport(score, percent, gradeText, reviewItems)], { type: 'text/plain;charset=utf-8' });
  formData.append('files[2]', txtBlob, 'report_' + userData.static + '.txt');

  try {
    const res = await fetch(DISCORD_WEBHOOK_URL + '?wait=true', { method: 'POST', body: formData });
    if (res.ok) {
      statusEl.className = 'status-msg ok';
      statusEl.textContent = '✅ Отчёт успешно отправлен.';
    } else {
      statusEl.className = 'status-msg err';
      statusEl.textContent = `⚠️ Ошибка (${res.status})`;
    }
  } catch (err) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Ошибка соединения.';
  }
}

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progressBar').style.width = progress + '%';
});
</script>
