function startTest() {
  const surname = document.getElementById('surname').value.trim();
  const name = document.getElementById('name').value.trim();
  const staticVal = document.getElementById('static').value.trim();
  const udoFile = document.getElementById('fileUdo').files[0];
  const planFile = document.getElementById('filePlan').files[0];

  if (!surname || !name || !staticVal || !udoFile || !planFile) {
    document.getElementById('authWarning').style.display = 'block';
    return;
  }

  userData = { surname, name, static: staticVal, udo: udoFile, plan: planFile };
  document.getElementById('screen-auth').classList.add('hidden');
  document.getElementById('screen-test').classList.remove('hidden');
  document.getElementById('userLabel').textContent =
    `${userData.surname} ${userData.name} | Статик: ${userData.static}`;
  renderQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestions() {
  const form = document.getElementById('testForm');
  form.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    if (q.part) {
      const partEl = document.createElement('div');
      partEl.className = 'part-title';
      partEl.textContent = q.part;
      form.appendChild(partEl);
    }
    const div = document.createElement('div');
    div.className = 'question';
    div.id = 'q' + idx;
    const title = document.createElement('div');
    title.className = 'q-title';
    title.innerHTML = `<span class="num">${idx + 1}</span>${q.text.replace(/^\d+\.\s*/, '')}`;
    div.appendChild(title);
    q.options.forEach((opt, oIdx) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.innerHTML = `<input type="radio" name="q${idx}" value="${oIdx}" onchange="onAnswer(${idx}, ${oIdx})"><span>${opt}</span>`;
      div.appendChild(label);
    });
    form.appendChild(div);
  });
  updateAnsweredCount();
}

function onAnswer(qIdx, oIdx) {
  answers[qIdx] = oIdx;
  document.getElementById('q' + qIdx).querySelectorAll('.option')
    .forEach((lbl, i) => lbl.classList.toggle('selected', i === oIdx));
  updateAnsweredCount();
}

function updateAnsweredCount() {
  const count = answers.filter(a => a !== null).length;
  document.getElementById('answeredCount').textContent = `Отвечено: ${count} / ${QUESTIONS.length}`;
}

function finishTest() {
  const unanswered = answers.filter(a => a === null).length;
  if (unanswered > 0) {
    if (!confirm(`Вы не ответили на ${unanswered} вопрос(ов). Завершить тест всё равно?`)) return;
  }

  const finishBtn = document.getElementById('finishBtn');
  finishBtn.disabled = true;
  finishBtn.textContent = 'Обработка...';

  let score = 0;
  const reviewItems = [];
  QUESTIONS.forEach((q, idx) => {
    const userAns = answers[idx];
    const isCorrect = userAns === q.correct;
    if (isCorrect) score++;
    reviewItems.push({
      num: idx + 1, text: q.text,
      userAnswerText: userAns !== null ? q.options[userAns] : '— (нет ответа)',
      correctAnswerText: q.options[q.correct],
      isCorrect
    });
  });

  document.getElementById('screen-test').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('screen-result').classList.remove('hidden');

  document.getElementById('resultUser').textContent =
    `${userData.surname} ${userData.name} | Статик: ${userData.static}`;
  document.getElementById('scoreDisplay').textContent = `${score} / ${QUESTIONS.length}`;

  const percent = Math.round((score / QUESTIONS.length) * 100);
  const gradeDisplay = document.getElementById('gradeDisplay');
  let gradeText = '', gradeColor = '#38bdf8';
  if (percent >= 90) { gradeText = 'Отлично'; gradeColor = '#22c55e'; }
  else if (percent >= 75) { gradeText = 'Хорошо'; gradeColor = '#38bdf8'; }
  else if (percent >= 60) { gradeText = 'Удовлетворительно'; gradeColor = '#facc15'; }
  else { gradeText = 'Неудовлетворительно'; gradeColor = '#ef4444'; }
  gradeDisplay.textContent = `${gradeText} (${percent}%)`;
  gradeDisplay.style.color = gradeColor;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '<h3 style="text-align:left;color:#facc15;margin-bottom:14px;font-size:16px;">Разбор ответов</h3>';
  reviewItems.forEach(item => {
    const div = document.createElement('div');
    div.className = 'review-item ' + (item.isCorrect ? 'correct' : 'wrong');
    const icon = item.isCorrect ? '✅' : '❌';
    div.innerHTML = `
      <div style="font-weight:600;margin-bottom:4px;">${icon} Вопрос ${item.num}</div>
      <div style="color:#cbd5e1;margin-bottom:6px;">${item.text}</div>
      <div class="ans">Ваш ответ: <b class="${item.isCorrect ? 'correct-txt' : 'wrong-txt'}">${item.userAnswerText}</b></div>
      ${!item.isCorrect ? `<div class="ans">Правильный ответ: <b class="correct-txt">${item.correctAnswerText}</b></div>` : ''}
    `;
    reviewList.appendChild(div);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
  sendToDiscord(score, percent, reviewItems);
}

/* ==================== КРАСИВЫЙ EMBED + КНОПКИ ==================== */
async function sendToDiscord(score, percent, reviewItems) {
  const statusEl = document.getElementById('discordStatus');

  if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes('ВСТАВЬТЕ')) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Webhook не настроен: результаты не отправлены.';
    return;
  }

  statusEl.className = 'status-msg loading';
  statusEl.textContent = '⏳ Отправка результатов в Discord...';

  const wrongCount = QUESTIONS.length - score;
  const embedColor = percent >= 90 ? 0x22c55e
                   : percent >= 75 ? 0x38bdf8
                   : percent >= 60 ? 0xfacc15
                   : 0xef4444;

  // Краткий список неверных (для embed, максимум ~1000 символов на поле)
  const wrongItems = reviewItems.filter(i => !i.isCorrect);
  let wrongText;
  if (wrongItems.length === 0) {
    wrongText = '✅ Все ответы верные';
  } else {
    const lines = wrongItems.map(i => {
      const qShort = i.text.replace(/^\d+\.\s*/, '');
      const user = i.userAnswerText.length > 60 ? i.userAnswerText.slice(0, 60) + '…' : i.userAnswerText;
      const corr = i.correctAnswerText.length > 60 ? i.correctAnswerText.slice(0, 60) + '…' : i.correctAnswerText;
      return `**${i.num}.** ${qShort}\n❌ ${user}\n✅ ${corr}`;
    });
    wrongText = '';
    for (const line of lines) {
      if ((wrongText + '\n\n' + line).length > 1000) { wrongText += '\n…(обрезано)'; break; }
      wrongText += (wrongText ? '\n\n' : '') + line;
    }
    if (!wrongText) wrongText = '—';
  }

  const safe = (v) => (!v || !String(v).trim()) ? '—' : String(v).slice(0, 1024);

  const payload = {
    username: 'Тест УК РО',
    embeds: [{
      title: '📝 Отчёт о прохождении теста',
      description: `**${userData.surname} ${userData.name}** · Статик: \`${userData.static}\``,
      color: embedColor,
      fields: [
        { name: '✅ Правильных', value: `**${score}**`, inline: true },
        { name: '❌ Неправильных', value: `**${wrongCount}**`, inline: true },
        { name: '📊 Процент', value: `**${percent}%**`, inline: true },
        { name: '🏆 Оценка', value: percent >= 90 ? 'Отлично' : percent >= 75 ? 'Хорошо' : percent >= 60 ? 'Удовлетворительно' : 'Неудовлетворительно', inline: false },
        { name: '📋 Неверные ответы', value: safe(wrongText), inline: false }
      ],
      footer: { text: 'Устный тест · УК РО / КоАП РО / Процессуальный кодекс' },
      timestamp: new Date().toISOString()
    }],
    components: [
      {
        type: 1,
        components: [
          { type: 2, style: 3, label: '✅ Принять', custom_id: 'approve_report' },
          { type: 2, style: 4, label: '❌ Отклонить', custom_id: 'reject_report' }
        ]
      }
    ]
  };

  const totalLen = JSON.stringify(payload.embeds[0]).length;
  if (totalLen > 5800) {
    payload.embeds[0].fields[4].value = `Неверных: ${wrongCount}. Разбор не отправлен (слишком длинный).`;
  }

  const formData = new FormData();
  formData.append('payload_json', JSON.stringify(payload));
  if (userData.udo) formData.append('files[0]', userData.udo, 'udo_' + userData.static + '.png');
  if (userData.plan) formData.append('files[1]', userData.plan, 'plan_' + userData.static + '.png');

  try {
    const res = await fetch(DISCORD_WEBHOOK_URL + '?wait=true', { method: 'POST', body: formData });
    if (res.ok) {
      const data = await res.json();
      // Сохраняем id сообщения и токен webhook — они нужны обработчику для редактирования
      console.log('Отправлено. Message ID:', data.id);
      statusEl.className = 'status-msg ok';
      statusEl.textContent = '✅ Отчёт отправлен руководству на проверку.';
    } else {
      const txt = await res.text();
      console.error('Discord error:', res.status, txt);
      statusEl.className = 'status-msg err';
      statusEl.textContent = `⚠️ Ошибка отправки (${res.status}): ${txt.slice(0, 200)}`;
    }
  } catch (err) {
    console.error('Fetch error:', err);
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Не удалось связаться с Discord: ' + err.message;
  }
}

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progressBar').style.width = progress + '%';
});
</script>
