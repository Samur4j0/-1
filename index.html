<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Устный тест | УКУ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Roboto+Mono:wght@500;700&display=swap');

    /* ============ ТЕМЫ ============ */
    :root {
      --bg: #050505;           
      --bg-card: rgba(15, 15, 15, 0.75);
      --bg-input: rgba(0, 0, 0, 0.6);
      --border: #2a2a2a;
      --border-hover: #555;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #ef4444;
      --accent-glow: rgba(239, 68, 68, 0.4);
      --gold: #fbbf24;
      --green: #10b981;
      --red: #ef4444;
      --shadow: 0 15px 35px rgba(0,0,0,0.8);
      --selected-bg: rgba(239, 68, 68, 0.15);
      --option-hover: rgba(255, 255, 255, 0.03);
      --gradient: linear-gradient(135deg, #ef4444, #991b1b, #ef4444);
      --font-main: 'Montserrat', sans-serif;
      --font-mono: 'Roboto Mono', monospace;
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-input: #ffffff;
      --border: #cbd5e1;
      --border-hover: #94a3b8;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #dc2626;
      --accent-glow: rgba(220, 38, 38, 0.2);
      --gold: #d97706;
      --green: #059669;
      --red: #dc2626;
      --shadow: 0 15px 35px rgba(15,23,42,0.08);
      --selected-bg: rgba(220, 38, 38, 0.1);
      --option-hover: #f1f5f9;
      --gradient: linear-gradient(135deg, #dc2626, #991b1b, #dc2626);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    body {
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      transition: background 0.5s, color 0.5s;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Анимированная сетка на фоне */
    .bg-grid {
      position: fixed;
      inset: -50%;
      background-image: 
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.15;
      z-index: 0;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 15s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
    }

    /* Красная аура по краям */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 150px rgba(239, 68, 68, 0.15);
      z-index: 9999;
    }

    /* Кастомный скроллбар */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff5555; }

    .container { 
      max-width: 900px; 
      margin: 0 auto; 
      position: relative;
      z-index: 1;
      animation: fadeIn 0.8s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ ШАПКА ============ */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .theme-toggle {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      width: 48px; height: 48px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow);
      transition: all 0.3s;
    }
    .theme-toggle:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); transform: scale(1.1); }

    h1 {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--gradient);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px var(--accent-glow);
      animation: shine 3s linear infinite;
    }
    @keyframes shine { to { background-position: 200% center; } }
    .subtitle { font-family: var(--font-mono); color: var(--text-muted); font-size: 13px; margin-top: 8px; letter-spacing: 1px; }

    /* ============ 3D КАРТОЧКИ ============ */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 35px;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-color 0.3s, box-shadow 0.3s;
      transform-style: preserve-3d;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.8;
    }
    .card h2 { font-size: 20px; color: var(--gold); margin-bottom: 25px; font-weight: 800; display: flex; align-items: center; gap: 10px; }

    /* ============ ИНПУТЫ ============ */
    label {
      display: block;
      margin-bottom: 8px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 16px 18px;
      margin-bottom: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-family: var(--font-main);
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }
    input[type="text"]:focus { 
      border-color: var(--accent); 
      box-shadow: 0 0 0 4px var(--accent-glow);
      transform: translateY(-2px);
    }
    input[type="file"] { padding: 10px; color: var(--text-muted); }
    input[type="file"]::file-selector-button {
      background: var(--border);
      border: none;
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 15px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
      transition: background 0.2s;
    }
    input[type="file"]::file-selector-button:hover { background: var(--border-hover); }

    /* ============ КНОПКИ ============ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient);
      background-size: 200% auto;
      color: #fff;
      border: none;
      padding: 18px 45px;
      font-family: var(--font-main);
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 5px 20px var(--accent-glow);
      position: relative;
      overflow: hidden;
      animation: shine 3s linear infinite;
    }
    .btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(45deg);
      transition: all 0.6s;
      opacity: 0;
    }
    .btn:hover::after { left: 100%; opacity: 1; }
    .btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 30px var(--accent-glow); }
    .btn:active { transform: translateY(0) scale(0.96); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; animation: none; }
    .btn-center { text-align: center; margin-top: 15px; }

    .hidden { display: none !important; }

    /* ============ ПРОГРЕСС ШАГОВ ============ */
    .step-header {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 22px 28px;
      margin-bottom: 25px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .step-header .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .step-header .row strong { color: var(--accent); font-weight: 700; font-size: 16px; }
    
    /* Таймер */
    .timer {
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
      background: var(--bg-input);
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .timer.danger {
      color: var(--red);
      border-color: var(--red);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
      animation: pulseDanger 1s infinite alternate;
    }
    @keyframes pulseDanger {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0.6; transform: scale(1.05); }
    }

    .step-bar { height: 8px; background: var(--bg-input); border-radius: 999px; overflow: hidden; position: relative; }
    .step-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      box-shadow: 0 0 15px var(--accent);
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(.22,.8,.35,1);
      position: relative;
    }
    .step-bar-fill::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 20px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8));
      animation: barGlow 1.5s infinite;
    }
    @keyframes barGlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    /* ============ ВОПРОС ============ */
    .question {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 40px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: relative;
    }
    .question.enter { animation: questionIn 0.6s cubic-bezier(.22,.8,.35,1) both; }
    .question.leave { animation: questionOut 0.3s ease-in both; }
    @keyframes questionIn { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes questionOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-30px); } }

    .q-part {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--selected-bg);
      border: 1px solid var(--border);
    }
    .q-title {
      font-weight: 800;
      margin-bottom: 30px;
      font-size: 20px;
      color: var(--text);
      line-height: 1.5;
      display: flex;
      gap: 18px;
    }
    .q-title .num {
      display: flex; align-items: center; justify-content: center;
      background: var(--gradient);
      color: #fff;
      min-width: 40px; height: 40px;
      border-radius: 12px;
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 5px 15px var(--accent-glow);
    }

    .typing-text { overflow: hidden; white-space: pre-wrap; animation: typing 1s steps(40, end); }
    @keyframes typing { from { max-height: 0; opacity: 0; } to { max-height: 200px; opacity: 1; } }

    .options { display: flex; flex-direction: column; gap: 14px; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 18px 24px;
      border-radius: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      font-size: 16px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(15px);
      animation: optionIn 0.4s forwards;
      position: relative;
      overflow: hidden;
    }
    @keyframes optionIn { to { opacity: 1; transform: translateY(0); } }
    
    .option .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.4);
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleEffect { to { transform: scale(4); opacity: 0; } }

    .option:hover { background: var(--option-hover); border-color: var(--border-hover); transform: translateX(8px); }
    .option input[type="radio"] { display: none; }
    .option .letter {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .option.selected {
      background: var(--selected-bg);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 20px var(--accent-glow);
      transform: translateX(10px) scale(1.01);
    }
    .option.selected .letter { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent); transform: scale(1.1); }

    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid var(--border);
    }
    .nav-row .btn { padding: 16px 35px; font-size: 15px; }
    .nav-row .btn-back { background: transparent; color: var(--text-muted); border: 2px solid var(--border); box-shadow: none; animation: none; }
    .nav-row .btn-back:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

    /* ============ РЕЗУЛЬТАТ ============ */
    .result-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 50px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
    }
    .result-card h2 { color: var(--gold); margin-bottom: 10px; font-size: 28px; }
    .result-card .score {
      font-size: 80px;
      font-weight: 900;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0;
      font-family: var(--font-mono);
      text-shadow: 0 0 40px var(--accent-glow);
      line-height: 1;
    }
    .result-card .grade { font-size: 24px; font-weight: 800; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 3px; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 40px 0;
    }
    .stat-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      transition: transform 0.3s;
    }
    .stat-box:hover { transform: translateY(-5px); }
    .stat-box .val { font-size: 36px; font-weight: 900; font-family: var(--font-mono); margin-bottom: 8px; }
    .stat-box .lbl { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
    .stat-box.green .val { color: var(--green); text-shadow: 0 0 15px rgba(16,185,129,0.4); }
    .stat-box.red .val { color: var(--red); text-shadow: 0 0 15px rgba(239,68,68,0.4); }
    .stat-box.gold .val { color: var(--gold); text-shadow: 0 0 15px rgba(251,191,36,0.4); }

    .status-msg {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 15px;
      margin-top: 25px;
      min-height: 24px;
      font-weight: 700;
    }
    .status-msg.ok { color: var(--green); }
    .status-msg.err { color: var(--red); }
    .status-msg.loading { color: var(--gold); }

    .warning { color: var(--red); font-size: 14px; margin-top: -10px; margin-bottom: 15px; display: none; font-weight: 700; }

    .progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 4px;
      background: var(--accent);
      box-shadow: 0 0 15px var(--accent);
      width: 0%;
      z-index: 9999;
      transition: width 0.1s;
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      color: var(--text);
      padding: 15px 30px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
      font-weight: 600;
      z-index: 10000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ============ МОБИЛЬНАЯ АДАПТАЦИЯ ============ */
    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      h1 { font-size: 26px; }
      .card, .question, .result-card { padding: 25px 20px; }
      .nav-row { flex-direction: column-reverse; }
      .nav-row .btn { width: 100%; }
      .result-card .score { font-size: 60px; }
      .q-title { font-size: 17px; }
      .stats-grid { grid-template-columns: 1fr; gap: 15px; }
      .btn { padding: 16px 25px; }
      .step-header .row { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="progress-bar" id="progressBar"></div>
<div class="toast" id="toast">Уведомление</div>

<div class="container">

  <div class="top-bar">
    <div>
      <h1>Протокол УКУ</h1>
      <p class="subtitle">УК РО · КоАП РО · Процессуальный кодекс</p>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- ЭКРАН 1: Регистрация -->
  <div id="screen-auth">
    <div class="card tilt" onmousemove="tilt(event, this)" onmouseleave="resetTilt(this)">
      <h2>📋 Идентификация сотрудника</h2>
      <label for="name">Имя *</label>
      <input type="text" id="name" placeholder="Введите имя" autocomplete="off">
      <label for="surname">Фамилия *</label>
      <input type="text" id="surname" placeholder="Введите фамилию" autocomplete="off">
      <label for="static">Статик *</label>
      <input type="text" id="static" placeholder="Введите статик" autocomplete="off">
      <label for="fileUdo">Удостоверение (УДО) *</label>
      <input type="file" id="fileUdo" accept="image/*">
      <label for="filePlan">Скрин планшета *</label>
      <input type="file" id="filePlan" accept="image/*">
      <div class="warning" id="authWarning">Заполните все поля и приложите скриншоты.</div>
      <div class="btn-center">
        <button class="btn" onclick="startTest()">Начать протокол</button>
      </div>
    </div>
  </div>

  <!-- ЭКРАН 2: Тест -->
  <div id="screen-test" class="hidden">
    <div class="step-header">
      <div class="row">
        <span>Сотрудник: <strong id="userLabel"></strong></span>
        <span>Вопрос <strong id="stepNum">1</strong> из <strong id="stepTotal">30</strong></span>
        <span class="timer" id="timerDisplay">25:00</span>
      </div>
      <div class="step-bar"><div class="step-bar-fill" id="stepFill"></div></div>
    </div>

    <div id="questionWrap"></div>
  </div>

  <!-- ЭКРАН 3: Результат -->
  <div id="screen-result" class="hidden">
    <div class="result-card">
      <h2>Протокол завершён</h2>
      <div style="color:var(--text-muted); font-family:var(--font-mono); font-size:15px;" id="resultUser"></div>
      
      <div class="score" id="scoreDisplay"></div>
      <div class="grade" id="gradeDisplay"></div>
      
      <div class="stats-grid" id="statsGrid"></div>

      <div class="status-msg" id="discordStatus"></div>
      <div class="btn-center" style="margin-top: 40px;">
        <button class="btn" onclick="location.reload()">Пройти заново</button>
      </div>
    </div>
  </div>

</div>

<script>
/* =====================================================================
   ⚙️ НАСТРОЙКА
   ===================================================================== */

const LETTERS = ['A', 'B', 'C', 'D'];
let userData = { name: '', surname: '', static: '', udo: null, plan: null };
let answers = new Array(QUESTIONS.length).fill(null);
let currentStep = 0;
let stepLocked = false;

/* Таймер */
let timeLeft = TEST_TIME_MINUTES * 60; 
let timerInterval = null;

function tilt(e, el) {
  const rect = el.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;
  const rotateX = ((y - centerY) / centerY) * -5;
  const rotateY = ((x - centerX) / centerX) * 5;
  el.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
}
function resetTilt(el) {
  el.style.transform = `perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)`;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('test-theme', theme); } catch(e) {}
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem('test-theme') || 'dark'; } catch(e) {}
  applyTheme(saved);
})();

/* Логика таймера */
function startTimer() {
  const timerDisplay = document.getElementById('timerDisplay');
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerDisplay.textContent = '00:00';
      showToast('⏰ Время вышло! Тест завершён.');
      finishTest(true); // Принудительное завершение
      return;
    }
    
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    timerDisplay.textContent = `${m}:${s}`;
    
    // Красная пульсация за 5 минут до конца
    if (timeLeft <= 300) {
      timerDisplay.classList.add('danger');
    }
  }, 1000);
}

function startTest() {
  const name = document.getElementById('name').value.trim();
  const surname = document.getElementById('surname').value.trim();
  const staticVal = document.getElementById('static').value.trim();
  const udoFile = document.getElementById('fileUdo').files[0];
  const planFile = document.getElementById('filePlan').files[0];

  if (!name || !surname || !staticVal || !udoFile || !planFile) {
    document.getElementById('authWarning').style.display = 'block';
    showToast('⚠️ Заполните все поля!');
    return;
  }
  userData = { name, surname, static: staticVal, udo: udoFile, plan: planFile };
  document.getElementById('screen-auth').classList.add('hidden');
  document.getElementById('screen-test').classList.remove('hidden');
  document.getElementById('userLabel').textContent = `${userData.name} ${userData.surname} · ${userData.static}`;
  document.getElementById('stepTotal').textContent = QUESTIONS.length;
  currentStep = 0;
  renderStep();
  startTimer(); // Запускаем таймер
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderStep() {
  const wrap = document.getElementById('questionWrap');
  const q = QUESTIONS[currentStep];
  const selected = answers[currentStep];

  wrap.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'question enter tilt';
  div.id = 'questionCard';
  div.onmousemove = (e) => tilt(e, div);
  div.onmouseleave = () => resetTilt(div);

  let partHtml = '';
  if (q.part) partHtml = `<div class="q-part">${q.part}</div>`;

  const optionsHtml = q.options.map((opt, i) => {
    const isSel = selected === i;
    return `
      <label class="option ${isSel ? 'selected' : ''}" style="animation-delay:${0.05 + i * 0.05}s" onclick="createRipple(event, this)">
        <input type="radio" name="q" value="${i}" ${isSel ? 'checked' : ''} onchange="pickOption(${i})">
        <span class="letter">${LETTERS[i]}</span>
        <span>${opt}</span>
      </label>
    `;
  }).join('');

  const isLast = currentStep === QUESTIONS.length - 1;
  div.innerHTML = `
    ${partHtml}
    <div class="q-title">
      <span class="num">${currentStep + 1}</span>
      <span class="typing-text">${q.text.replace(/^\d+\.\s*/, '')}</span>
    </div>
    <div class="options" id="optionsBox">${optionsHtml}</div>
    <div class="nav-row">
      <button class="btn btn-back" onclick="prevStep()" ${currentStep === 0 ? 'disabled' : ''}>← Назад</button>
      <button class="btn" id="nextBtn" onclick="nextStep()" disabled>${isLast ? 'Завершить' : 'Далее →'}</button>
    </div>
  `;
  wrap.appendChild(div);

  document.getElementById('stepNum').textContent = currentStep + 1;
  const fill = ((currentStep + (selected !== null ? 1 : 0)) / QUESTIONS.length) * 100;
  document.getElementById('stepFill').style.width = fill + '%';
  document.getElementById('nextBtn').disabled = selected === null;
}

function createRipple(event, element) {
  const ripple = document.createElement("span");
  ripple.classList.add("ripple");
  element.appendChild(ripple);
  const rect = element.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = event.clientX - rect.left - size / 2 + 'px';
  ripple.style.top = event.clientY - rect.top - size / 2 + 'px';
  setTimeout(() => ripple.remove(), 600);
}

function pickOption(oIdx) {
  answers[currentStep] = oIdx;
  document.querySelectorAll('#optionsBox .option').forEach((el, i) => {
    el.classList.toggle('selected', i === oIdx);
  });
  document.getElementById('nextBtn').disabled = false;
  const fill = ((currentStep + 1) / QUESTIONS.length) * 100;
  document.getElementById('stepFill').style.width = fill + '%';
}

function nextStep() {
  if (stepLocked || answers[currentStep] === null) return;
  if (currentStep === QUESTIONS.length - 1) { finishTest(); return; }

  stepLocked = true;
  document.getElementById('questionCard').classList.add('leave');
  setTimeout(() => {
    currentStep++;
    renderStep();
    stepLocked = false;
  }, 300);
}

function prevStep() {
  if (stepLocked || currentStep === 0) return;
  stepLocked = true;
  document.getElementById('questionCard').classList.add('leave');
  setTimeout(() => {
    currentStep--;
    renderStep();
    stepLocked = false;
  }, 300);
}

/* forceFinish = true, если сработал таймер */
function finishTest(forceFinish = false) {
  if (!forceFinish && answers.includes(null)) {
    if (!confirm(`Вы не ответили на все вопросы. Завершить?`)) return;
  }

  // Останавливаем таймер
  if (timerInterval) clearInterval(timerInterval);

  let score = 0;
  const reviewItems = [];
  QUESTIONS.forEach((q, idx) => {
    const userAns = answers[idx];
    const isCorrect = userAns === q.correct;
    if (isCorrect) score++;
    reviewItems.push({
      num: idx + 1, text: q.text,
      userAnswerText: userAns !== null ? `${LETTERS[userAns]}) ${q.options[userAns]}` : '—',
      correctAnswerText: `${LETTERS[q.correct]}) ${q.options[q.correct]}`,
      isCorrect
    });
  });

  document.getElementById('screen-test').classList.add('hidden');
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('screen-result').classList.remove('hidden');

  document.getElementById('resultUser').textContent = `${userData.name} ${userData.surname} | ${userData.static}`;
  document.getElementById('scoreDisplay').textContent = `${score} / ${QUESTIONS.length}`;

  const percent = Math.round((score / QUESTIONS.length) * 100);
  const wrongCount = QUESTIONS.length - score;
  
  const statsGrid = document.getElementById('statsGrid');
  statsGrid.innerHTML = `
    <div class="stat-box green">
      <div class="val">${score}</div>
      <div class="lbl">Правильно</div>
    </div>
    <div class="stat-box red">
      <div class="val">${wrongCount}</div>
      <div class="lbl">Ошибок</div>
    </div>
    <div class="stat-box gold">
      <div class="val">${percent}%</div>
      <div class="lbl">Успех</div>
    </div>
  `;

  const gradeDisplay = document.getElementById('gradeDisplay');
  let gradeText = '', gradeColor = 'var(--accent)';
  if (percent >= 90) { gradeText = 'Отлично'; gradeColor = 'var(--green)'; }
  else if (percent >= 75) { gradeText = 'Хорошо'; gradeColor = 'var(--accent)'; }
  else if (percent >= 60) { gradeText = 'Удовлетворительно'; gradeColor = 'var(--gold)'; }
  else { gradeText = 'Неудовлетворительно'; gradeColor = 'var(--red)'; }
  gradeDisplay.textContent = `${gradeText}`;
  gradeDisplay.style.color = gradeColor;

  window.scrollTo({ top: 0, behavior: 'smooth' });
  sendToDiscord(score, percent, gradeText, reviewItems);
}

function buildTxtReport(score, percent, gradeText, reviewItems) {
  const wrongCount = QUESTIONS.length - score;
  const line = '='.repeat(60);
  const lines = [
    line,
    '           ОТЧЁТ О ПРОХОЖДЕНИИ ТЕСТА',
    '     УК РО / КоАП РО / Процессуальный кодекс РО',
    line,
    '',
    `Дата и время:        ${new Date().toLocaleString('ru-RU')}`,
    `Сотрудник:           ${userData.name} ${userData.surname}`,
    `Статик:              ${userData.static}`,
    '',
    `Всего вопросов:      ${QUESTIONS.length}`,
    `Правильных ответов:  ${score}`,
    `Неправильных:        ${wrongCount}`,
    `Процент:             ${percent}%`,
    `Оценка:              ${gradeText}`,
    '',
    line,
    '                  РАЗБОР ОТВЕТОВ',
    line,
    ''
  ];
  reviewItems.forEach(item => {
    lines.push(`--- Вопрос ${item.num} ---`);
    lines.push(item.text);
    lines.push(`  Ваш ответ:        ${item.userAnswerText}`);
    if (!item.isCorrect) lines.push(`  Правильный ответ: ${item.correctAnswerText}`);
    lines.push(`  Результат:        ${item.isCorrect ? 'ВЕРНО' : 'ОШИБКА'}`);
    lines.push('');
  });
  lines.push(line, 'Конец отчёта.', line);
  return lines.join('\n');
}

async function sendToDiscord(score, percent, gradeText, reviewItems) {
  const statusEl = document.getElementById('discordStatus');
  if (!DISCORD_WEBHOOK_URL || DISCORD_WEBHOOK_URL.includes('ВСТАВЬТЕ')) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Webhook не настроен.';
    return;
  }

  statusEl.className = 'status-msg loading';
  statusEl.innerHTML = '<span class="spinner"></span> Отправка отчёта...';

  const wrongCount = QUESTIONS.length - score;
  const embedColor = percent >= 90 ? 0x10b981 : percent >= 75 ? 0xef4444 : percent >= 60 ? 0xfbbf24 : 0xef4444;
  
  let content = '';
  let allowed_mentions = { parse: [] };
  
  if (NOTIFY_USER_ID.trim()) {
    const pings = NOTIFY_USER_ID.split(',').map(id => id.trim()).filter(id => /^\d{17,20}$/.test(id)).map(id => `<@${id}>`).join(' ');
    if (pings) {
      content = `${pings} — Уважаемое Руководство УКУ проверьте отчёт от сотрудника МВД.`;
      allowed_mentions = { parse: ["users"] }; 
    }
  }

  const payload = {
    username: 'Протокол УКУ',
    content: content || undefined,
    allowed_mentions: allowed_mentions,
    embeds: [{
      title: '📝 Отчёт о прохождении теста',
      description: `**${userData.name} ${userData.surname}** · Статик: \`${userData.static}\``,
      color: embedColor,
      fields: [
        { name: '✅ Правильных', value: `**${score}**`, inline: true },
        { name: '❌ Неправильных', value: `**${wrongCount}**`, inline: true },
        { name: '📊 Процент', value: `**${percent}%**`, inline: true },
        { name: '🏆 Оценка', value: gradeText, inline: false }
      ],
      footer: { text: 'УКУ · УК РО / КоАП РО / Процессуальный кодекс' },
      timestamp: new Date().toISOString()
    }]
  };

  const formData = new FormData();
  formData.append('payload_json', JSON.stringify(payload));
  
  if (userData.udo) formData.append('files[0]', userData.udo, 'udo_' + userData.static + '.png');
  if (userData.plan) formData.append('files[1]', userData.plan, 'plan_' + userData.static + '.png');
  
  const txtBlob = new Blob([buildTxtReport(score, percent, gradeText, reviewItems)], { type: 'text/plain;charset=utf-8' });
  formData.append('files[2]', txtBlob, 'report_' + userData.static + '.txt');

  try {
    const res = await fetch(DISCORD_WEBHOOK_URL + '?wait=true', { method: 'POST', body: formData });
    if (res.ok) {
      statusEl.className = 'status-msg ok';
      statusEl.textContent = '✅ Отчёт успешно отправлен.';
      showToast('🎉 Успешно отправлено!');
    } else {
      statusEl.className = 'status-msg err';
      statusEl.textContent = `⚠️ Ошибка (${res.status})`;
      showToast('❌ Ошибка отправки!');
    }
  } catch (err) {
    statusEl.className = 'status-msg err';
    statusEl.textContent = '⚠️ Ошибка соединения.';
    showToast('📡 Нет соединения с Discord.');
  }
}

window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  document.getElementById('progressBar').style.width = progress + '%';
});
</script>
</body>
</html>
